<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STUDY.LOG">
<meta name="theme-color" content="#05060d">
<meta name="description" content="Lernkarten für die Technikerschule – offline, mit Stufen-System, Import aus Chats, Level und Erfolgen.">
<title>STUDY.LOG</title>
<link rel="manifest" href="./manifest.json?v=1">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root{
  --bg:#05060d; --bg2:#0a0d1d; --panel:#0f1329; --panel2:#151a37; --line:#252c63; --line2:#3a4396;
  --text:#eef1ff; --dim:#8d96cc; --dim2:#5d6597;
  --volt:#ffe53b; --volt-d:#8f7f00; --cyan:#29f0ff; --cyan-d:#0a7d88; --mag:#ff3ddc; --ok:#38ff9c; --ok-d:#0d8a4f;
  --bad:#ff4570; --bad-d:#8f1736; --orange:#ff9d2e; --paper:#f4f6ff;
  --pix: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --sans: -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --math: "STIX Two Math","Cambria Math","Times New Roman",Times,serif;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px); --sar: env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4}
body{min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(41,240,255,.16),transparent 60%),
    radial-gradient(80% 50% at 100% 110%,rgba(255,61,220,.12),transparent 60%),
    linear-gradient(rgba(41,240,255,.06) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,rgba(41,240,255,.06) 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
#bg:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);opacity:.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter;vertical-align:middle;flex:none}
.pix{font-family:var(--pix);text-transform:uppercase;letter-spacing:.08em}
.dim{color:var(--dim)} .volt{color:var(--volt)} .cyan{color:var(--cyan)}
.glow{color:var(--volt);text-shadow:0 0 6px rgba(255,229,59,.75),0 0 18px rgba(255,229,59,.35)}
.glow-c{color:var(--cyan);text-shadow:0 0 6px rgba(41,240,255,.75),0 0 18px rgba(41,240,255,.3)}
.hidden{display:none!important}

/* ---------- Kopf & Tabs ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--sat) + 8px) calc(14px + var(--sar)) 8px calc(14px + var(--sal));
  display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(5,6,13,.97),rgba(5,6,13,.85));
  border-bottom:2px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-weight:800;font-size:19px;letter-spacing:.06em}
.logo .ic{width:24px;height:24px;color:var(--volt);filter:drop-shadow(0 0 5px rgba(255,229,59,.8));animation:flicker 4s steps(1) infinite}
.logo b{color:var(--volt)} .logo span{color:var(--cyan)}
.chip{font-family:var(--pix);font-size:12px;font-weight:700;letter-spacing:.06em;padding:5px 9px;border:2px solid var(--volt);color:var(--volt);background:rgba(255,229,59,.08);box-shadow:0 0 12px rgba(255,229,59,.25)}
#main{padding:calc(var(--sat) + 64px) calc(14px + var(--sar)) calc(var(--sab) + 92px) calc(14px + var(--sal));max-width:640px;margin:0 auto}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(5,6,13,.96);border-top:2px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--dim2);font-family:var(--pix);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;position:relative}
#tabs button.on{color:var(--volt);text-shadow:0 0 8px rgba(255,229,59,.6)}
#tabs button.on:before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:3px;background:var(--volt);box-shadow:0 0 10px var(--volt)}
#tabs .ic{width:24px;height:24px}

/* ---------- Bausteine ---------- */
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);box-shadow:4px 4px 0 #000;padding:14px;margin:0 0 14px;position:relative}
.panel.hl{border-color:var(--volt);box-shadow:4px 4px 0 #000,0 0 22px rgba(255,229,59,.15)}
.panel h2,.panel h3{margin:0 0 10px;font-family:var(--pix);text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.panel h3{font-size:13px;color:var(--cyan)}
.panel p{margin:0 0 10px;color:var(--dim);font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-h h2{margin:0;font-family:var(--pix);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 16px;font-family:var(--pix);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  color:#111;background:var(--volt);border:2px solid #fff6a8;box-shadow:0 4px 0 var(--volt-d),0 0 18px rgba(255,229,59,.3);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--volt-d)}
.btn.full{width:100%}
.btn.cy{background:var(--cyan);border-color:#b8fbff;box-shadow:0 4px 0 var(--cyan-d),0 0 18px rgba(41,240,255,.3)}
.btn.cy:active:not(:disabled){box-shadow:0 1px 0 var(--cyan-d)}
.btn.ghost{background:rgba(41,240,255,.06);color:var(--cyan);border-color:var(--cyan);box-shadow:0 4px 0 #04363b}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 #04363b}
.btn.ok{background:var(--ok);border-color:#c5ffe2;box-shadow:0 4px 0 var(--ok-d),0 0 18px rgba(56,255,156,.3)}
.btn.bad{background:var(--bad);color:#fff;border-color:#ffc2d1;box-shadow:0 4px 0 var(--bad-d),0 0 18px rgba(255,69,112,.3)}
.btn.ok:active:not(:disabled){box-shadow:0 1px 0 var(--ok-d)} .btn.bad:active:not(:disabled){box-shadow:0 1px 0 var(--bad-d)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 #3d0716}
.btn.sm{min-height:38px;padding:7px 11px;font-size:12px}
.row{display:flex;gap:10px} .row>*{flex:1}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line2);background:var(--panel);color:var(--text)}
.icon-btn:active{background:var(--line)}
.tag{display:inline-block;font-family:var(--pix);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border:1.5px solid currentColor;line-height:1}
.t-frage{color:var(--cyan)} .t-formel{color:var(--volt)} .t-zeichen{color:var(--mag)} .t-these{color:var(--orange)}
.empty{text-align:center;padding:26px 14px}
.empty .big-ic .ic{width:56px;height:56px;color:var(--volt);filter:drop-shadow(0 0 10px rgba(255,229,59,.6))}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-family:var(--pix);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.inp{width:100%;background:#070914;border:2px solid var(--line2);padding:11px 12px;border-radius:0;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 14px rgba(41,240,255,.25)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.35}
input[type=date].inp{min-height:48px}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:15px}
.chk input{width:24px;height:24px;accent-color:var(--volt);flex:none}
.seg{display:flex;border:2px solid var(--line2);margin:0 0 12px}
.seg button{flex:1;padding:11px 2px;font-family:var(--pix);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-right:2px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--volt);color:#111}
.stepper{display:flex;align-items:center;gap:0;border:2px solid var(--line2)}
.stepper button{width:46px;height:44px;font-size:22px;font-weight:800;color:var(--cyan)}
.stepper b{min-width:64px;text-align:center;font-family:var(--pix);font-size:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-size:15px} .set-row .lbl small{display:block;color:var(--dim);font-size:12px;margin-top:2px}

/* ---------- Spielerkarte ---------- */
.player{display:flex;gap:14px;align-items:center}
.lvl{width:68px;height:68px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--volt);background:radial-gradient(circle,rgba(255,229,59,.18),transparent 70%);box-shadow:0 0 16px rgba(255,229,59,.35),inset 0 0 12px rgba(255,229,59,.2);font-family:var(--pix)}
.lvl span{font-size:10px;letter-spacing:.15em;color:var(--volt)} .lvl b{font-size:28px;line-height:1;color:#fff;text-shadow:0 0 8px rgba(255,229,59,.8)}
.pl-info{flex:1;min-width:0}
.pl-title{font-family:var(--pix);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--volt);margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:14px;border:2px solid var(--volt);background:#000;padding:1px;position:relative}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--volt) 0 6px,#ffc400 6px 12px);background-size:17px 17px;animation:flow .9s linear infinite;box-shadow:0 0 10px rgba(255,229,59,.7);min-width:2px}
.pl-xp{font-family:var(--pix);font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.04em}
.pl-stats{display:flex;gap:8px;margin-top:12px}
.pl-stats>div{flex:1;border:2px solid var(--line);padding:8px 6px;text-align:center;background:rgba(0,0,0,.25)}
.pl-stats b{display:block;font-family:var(--pix);font-size:18px;color:#fff}
.pl-stats b .ic{width:18px;height:18px;color:var(--volt);margin:-3px 2px 0 0}
.pl-stats span{display:block;font-family:var(--pix);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.pl-stats .joker-off b{color:var(--dim2)}
.today{display:flex;align-items:center;gap:12px}
.today .ic{width:30px;height:30px;color:var(--cyan)}
.today.done .ic{color:var(--ok)}
.today b{font-family:var(--pix);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.today small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.banner{display:flex;align-items:center;gap:10px;border:2px dashed var(--orange);color:var(--orange);padding:10px 12px;margin:0 0 14px;font-size:14px}
.banner .btn{margin-left:auto}

/* ---------- Stapel ---------- */
.deck{display:block;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);box-shadow:4px 4px 0 #000;padding:12px 12px 10px;margin:0 0 12px;cursor:pointer;position:relative}
.deck:active{border-color:var(--line2)}
.deck.has-due{border-color:var(--cyan);box-shadow:4px 4px 0 #000,0 0 18px rgba(41,240,255,.15)}
.deck.is-done{border-color:var(--ok-d)}
.deck-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.deck h3{margin:0;font-size:17px;line-height:1.25;word-break:break-word}
.exam{flex:none;font-family:var(--pix);font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 6px;color:var(--mag);border:1.5px solid var(--mag);white-space:nowrap}
.exam.soon{color:#111;background:var(--mag);box-shadow:0 0 12px rgba(255,61,220,.5)}
.exam.past{color:var(--dim2);border-color:var(--dim2)}
.deck-mid{display:flex;align-items:center;gap:12px;margin:10px 0 9px}
.due{min-width:58px;text-align:center}
.due b{display:block;font-family:var(--pix);font-size:28px;line-height:1;color:var(--cyan);text-shadow:0 0 10px rgba(41,240,255,.6)}
.due span{font-family:var(--pix);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.due.ok b{color:var(--ok);text-shadow:0 0 10px rgba(56,255,156,.6)} .due.zero b{color:var(--dim2);text-shadow:none}
.deck-meta{flex:1;font-size:13px;color:var(--dim);line-height:1.45}
.play{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--cyan);color:#111;border:2px solid #b8fbff;box-shadow:0 4px 0 var(--cyan-d),0 0 14px rgba(41,240,255,.4)}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cyan-d)}
.play .ic{width:24px;height:24px;fill:#111;stroke:#111}
.mbar{height:8px;background:#000;border:1.5px solid var(--line2);display:flex}
.mbar i{display:block;height:100%}
.mbar .s-hi{background:var(--ok);box-shadow:0 0 8px rgba(56,255,156,.6)} .mbar .s-mid{background:var(--cyan)} .mbar .s-lo{background:var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.dk-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dk-head h1{flex:1;margin:0;font-size:21px;line-height:1.2;word-break:break-word}
.desc{color:var(--dim);font-size:14px;margin:-4px 0 12px}
.examrow{display:flex;align-items:center;gap:10px;font-size:14px}
.examrow .ic{color:var(--mag)}
.examrow b{font-family:var(--pix);color:var(--mag);letter-spacing:.04em}
.kpis{display:flex;gap:8px;margin-top:12px}
.kpis>div{flex:1;text-align:center;border:2px solid var(--line);padding:8px 4px;background:rgba(0,0,0,.25)}
.kpis b{display:block;font-family:var(--pix);font-size:18px}
.kpis span{font-family:var(--pix);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.search{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.search .ic{color:var(--dim)}
.clist{border:2px solid var(--line);background:var(--panel)}
.crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.crow:last-child{border-bottom:0}
.crow:active{background:var(--panel2)}
.crow-f{flex:1;min-width:0;font-size:15px;max-height:2.9em;overflow:hidden;line-height:1.4}
.crow-f .mdisp{display:inline;margin:0}
.stg{font-family:var(--pix);font-size:11px;font-weight:800;color:var(--dim);flex:none;min-width:30px;text-align:right}
.stg.hi{color:var(--ok)} .stg.new{color:var(--cyan)}
.more{padding:12px;text-align:center;color:var(--dim);font-size:13px}

/* ---------- Ebenen (Lernen, Editor, Skizze) ---------- */
#layer{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
#layer.hidden{display:none}
#layer:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background:
  radial-gradient(100% 50% at 50% 0,rgba(41,240,255,.12),transparent 60%),
  linear-gradient(rgba(41,240,255,.05) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(41,240,255,.05) 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
.ly{max-width:640px;margin:0 auto;padding:calc(var(--sat) + 10px) calc(14px + var(--sar)) calc(var(--sab) + 20px) calc(14px + var(--sal));min-height:100%;display:flex;flex-direction:column}
.ses-top{display:flex;align-items:center;gap:10px}
.ses-prog{flex:1;height:12px;border:2px solid var(--cyan);background:#000;padding:1px}
.ses-prog i{display:block;height:100%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:width .3s}
.ses-count{font-family:var(--pix);font-size:13px;font-weight:800;min-width:54px;text-align:right}
.ses-deck{font-family:var(--pix);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:10px 0 10px;display:flex;justify-content:space-between;gap:10px}
.ses-deck b{color:var(--orange)}
.flip{perspective:1400px;-webkit-perspective:1400px;flex:1;display:flex;flex-direction:column;cursor:pointer}
.flip-in{display:grid;flex:1;transition:transform .45s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;position:relative}
.flip-in.is-flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;min-height:46vh;display:flex;flex-direction:column;padding:14px 16px 16px;
  background:radial-gradient(120% 80% at 50% 0,rgba(255,255,255,.05),transparent 60%),var(--panel);border:2px solid currentColor;box-shadow:4px 4px 0 #000,0 0 26px -6px currentColor}
.face.back{transform:rotateY(180deg)}
.face .tags{display:flex;gap:6px;flex-wrap:wrap}
.face .lbl{font-family:var(--pix);font-size:10px;letter-spacing:.14em;color:var(--dim);margin-left:auto;align-self:center}
.face-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;color:var(--text);font-size:23px;line-height:1.4;padding:16px 2px;word-break:break-word}
.face.back .face-body{font-size:20px}
.face .hint{text-align:center;font-family:var(--pix);font-size:10px;letter-spacing:.12em;color:var(--dim2);text-transform:uppercase}
.media{background:var(--paper);border:2px solid #000;box-shadow:0 0 0 2px currentColor;padding:6px;margin:6px 0 4px;min-height:40px}
.media img{display:block;width:100%;height:auto;max-height:36vh;object-fit:contain}
.ses-btns{display:flex;gap:10px;margin-top:16px}
.ses-btns .btn{flex:1;min-height:62px;font-size:14px;letter-spacing:.03em;padding:10px 8px;gap:6px}
.ses-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;min-height:40px}
.ses-foot .lnk{display:inline-flex;align-items:center;gap:6px;font-family:var(--pix);font-size:12px;letter-spacing:.06em;color:var(--dim);padding:8px 0}
.ses-foot .stage{font-family:var(--pix);font-size:11px;color:var(--dim2);letter-spacing:.06em}
.end{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 0}
.end h1{font-family:var(--pix);font-size:30px;line-height:1.15;margin:16px 0 6px;letter-spacing:.04em}
.end .bolt-big .ic{width:84px;height:84px;color:var(--volt);filter:drop-shadow(0 0 16px rgba(255,229,59,.8));animation:zap 1.2s ease-out}
.end .grid3{display:flex;gap:8px;margin:20px 0}
.end .grid3>div{flex:1;border:2px solid var(--line);padding:10px 4px;background:var(--panel)}
.end .grid3 b{display:block;font-family:var(--pix);font-size:22px}
.end .grid3 span{font-family:var(--pix);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.end .btn{margin-top:10px}

/* Editor */
.ed-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ed-top h2{flex:1;margin:0;font-family:var(--pix);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.side{border:2px solid var(--line);padding:12px;margin-bottom:14px;background:var(--panel)}
.side>span{display:block;font-family:var(--pix);font-size:11px;letter-spacing:.12em;color:var(--cyan);margin-bottom:8px}
.tb{display:none;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.side.act .tb{display:flex}
.tb button{min-width:38px;height:36px;padding:0 7px;border:1.5px solid var(--line2);background:#070914;font-family:var(--math);font-size:16px;color:var(--volt)}
.tb button:active{background:var(--line)}
.tb button.wide{font-family:var(--pix);font-size:11px;font-weight:800;color:var(--cyan)}
.prev{margin-top:10px;padding:10px;border:1.5px dashed var(--line2);min-height:44px;font-size:18px;text-align:center;word-break:break-word}
.prev:empty:before{content:"Vorschau";color:var(--dim2);font-family:var(--pix);font-size:11px;letter-spacing:.1em}
.ed-media{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.thumb{width:96px;height:66px;background:var(--paper);border:2px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%}
.ed-info{font-size:13px;color:var(--dim);margin:0 0 14px}

/* Skizze */
.sk{display:flex;flex-direction:column;min-height:100%}
.sk-canvas{background:var(--paper);background-image:linear-gradient(rgba(31,79,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(31,79,255,.12) 1px,transparent 1px);background-size:20px 20px;border:2px solid var(--volt);box-shadow:0 0 18px rgba(255,229,59,.25)}
.sk-canvas canvas{display:block;width:100%;height:auto;touch-action:none}
.sk-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.sw{width:40px;height:40px;border:3px solid #000;box-shadow:0 0 0 2px var(--line2)}
.sw.on{box-shadow:0 0 0 3px var(--volt),0 0 12px var(--volt)}
.wd{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line2);background:var(--panel)}
.wd.on{border-color:var(--volt)}
.wd i{display:block;background:var(--text);border-radius:50%}
.tool.on{border-color:var(--volt);color:var(--volt)}

/* Sheet */
#sheet{cursor:pointer;position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
#sheet.hidden{display:none}
.sh{cursor:auto;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-top:3px solid var(--volt);box-shadow:0 -10px 40px rgba(255,229,59,.15);
  padding:18px calc(16px + var(--sar)) calc(var(--sab) + 18px) calc(16px + var(--sal));animation:up .22s ease-out}
.sh h2{margin:0 0 12px;font-family:var(--pix);font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.sh p{color:var(--dim);font-size:14px;margin:0 0 12px}
.sh ul{margin:0 0 14px;padding-left:20px;color:var(--text);font-size:14px} .sh li{margin-bottom:6px}
.sh .btn{margin-top:6px}
.news-v{font-family:var(--pix);color:var(--volt);font-size:12px;letter-spacing:.08em;margin:10px 0 6px}
.form-pick{display:flex;gap:10px;margin:10px 0 4px}
.form-pick .btn{flex:1}

/* Import */
.plan{border:2px solid var(--line2);padding:12px;margin:12px 0;background:#070914}
.plan h4{margin:0 0 4px;font-size:16px}
.plan .meta{font-size:13px;color:var(--dim);margin-bottom:8px}
.warn{font-size:12px;color:var(--orange);margin:4px 0}
.err{color:var(--bad);font-size:14px;margin:10px 0}
.guide{white-space:pre-wrap;font-family:var(--pix);font-size:11.5px;line-height:1.45;background:#070914;border:1.5px solid var(--line2);padding:10px;max-height:40vh;overflow:auto;-webkit-user-select:text;user-select:text}

/* Erfolge */
.ladder{border:2px solid var(--line);background:var(--panel)}
.ladder>div{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px}
.ladder>div:last-child{border-bottom:0}
.ladder .lv{font-family:var(--pix);font-size:11px;color:var(--dim);min-width:48px}
.ladder .got{color:var(--text)} .ladder .got .ic{color:var(--ok)}
.ladder .cur{background:rgba(255,229,59,.08);color:var(--volt);font-weight:700}
.ladder .lock{color:var(--dim2)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{border:2px solid var(--line);background:var(--panel);padding:12px 10px;text-align:center;min-height:132px}
.ach .badge{width:46px;height:46px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--dim2);color:var(--dim2);transform:rotate(45deg)}
.ach .badge .ic{transform:rotate(-45deg)}
.ach b{display:block;font-family:var(--pix);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.ach small{display:block;font-size:12px;color:var(--dim);line-height:1.3}
.ach.on{border-color:var(--volt);box-shadow:0 0 16px rgba(255,229,59,.12)}
.ach.on .badge{border-color:var(--volt);color:var(--volt);background:rgba(255,229,59,.1);box-shadow:0 0 12px rgba(255,229,59,.4)}
.ach.off{opacity:.62}
.xp-rules{font-size:13px;color:var(--dim);margin:0;padding-left:18px} .xp-rules li{margin-bottom:4px}

/* Statistik */
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kgrid>div{border:2px solid var(--line);background:rgba(0,0,0,.25);padding:10px 4px;text-align:center}
.kgrid b{display:block;font-family:var(--pix);font-size:19px}
.kgrid span{font-family:var(--pix);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .bv{width:100%;display:flex;flex-direction:column-reverse;min-height:2px}
.bars .bv i{display:block;width:100%}
.bars .b-ok{background:var(--ok)} .bars .b-bad{background:var(--bad)} .bars .b-fc{background:var(--cyan);box-shadow:0 0 8px rgba(41,240,255,.4)}
.bars .bl{font-family:var(--pix);font-size:9px;color:var(--dim);margin-top:4px}
.bars .bn{font-family:var(--pix);font-size:9px;color:var(--text);margin-bottom:2px}
.dtab{width:100%;border-collapse:collapse;font-size:13px}
.dtab td,.dtab th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.dtab td:first-child,.dtab th:first-child{text-align:left}
.dtab th{font-family:var(--pix);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}

/* Toasts & Effekte */
#toasts{position:fixed;top:calc(var(--sat) + 10px);left:12px;right:12px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{max-width:420px;width:100%;display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--cyan);box-shadow:4px 4px 0 #000,0 0 18px rgba(41,240,255,.3);padding:10px 12px;font-size:14px;animation:drop .25s ease-out}
.toast.tach{border-color:var(--volt);box-shadow:4px 4px 0 #000,0 0 22px rgba(255,229,59,.45)}
.toast .ic{color:var(--volt)}
.toast b{display:block;font-family:var(--pix);font-size:10px;letter-spacing:.12em;color:var(--volt)}
.toast.out{opacity:0;transform:translateY(-10px);transition:all .3s}
#flash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;pointer-events:none;opacity:0}
#flash.ok{animation:fl-ok .35s ease-out} #flash.bad{animation:fl-bad .35s ease-out}
#fx{cursor:pointer;position:fixed;top:0;right:0;bottom:0;left:0;z-index:95;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(255,229,59,.24),transparent 58%),#05060d;padding:20px}
#fx.hidden{display:none}
#fx svg.zap{width:150px;height:200px;filter:drop-shadow(0 0 14px var(--volt))}
#fx svg.zap path{fill:none;stroke:var(--volt);stroke-width:7;stroke-linejoin:miter;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .5s ease-out forwards}
#fx h1{font-family:var(--pix);font-size:38px;margin:14px 0 4px;letter-spacing:.08em;animation:pulse 1s ease-in-out infinite}
#fx .lv{font-family:var(--pix);font-size:18px;color:#fff;letter-spacing:.1em}
#fx .nt{margin-top:14px;font-family:var(--pix);font-size:13px;color:var(--cyan);letter-spacing:.08em;text-transform:uppercase}
#fx small{margin-top:24px;font-family:var(--pix);font-size:10px;color:var(--dim);letter-spacing:.12em}
#fx:before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:#fff;animation:whiteflash .5s ease-out forwards;pointer-events:none}

/* Mathe */
.m{font-family:var(--math);font-size:1.12em;white-space:nowrap;line-height:1.6}
.mdisp{display:block;margin:6px 0;white-space:normal}
.m i{font-style:italic;padding-right:.04em}
.mf{display:inline-block;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.94em}
.mfn{display:block;padding:0 .18em .08em;border-bottom:.07em solid currentColor;line-height:1.25}
.mfd{display:block;padding:.1em .18em 0;line-height:1.25}
.msp,.msb{font-size:.68em;line-height:0}
.mss{display:inline-block;vertical-align:-.5em;font-size:.68em;line-height:1.1;text-align:left}
.mss>span{display:block}
.mq{display:inline-block;white-space:nowrap}
.mqs{font-size:1.08em}
.mqr{display:inline-block;border-top:.07em solid currentColor;padding:.06em .1em 0 .04em;line-height:1.25}
.mqi{font-size:.58em;vertical-align:.9em;margin-right:-.45em}
.ma{position:relative;display:inline-block;line-height:1.05}
.ma-t{position:absolute;left:0;right:0;top:-.42em;text-align:center;font-size:.72em;line-height:1;font-style:normal}
.ma.av .ma-t{top:-.6em;font-size:.78em}
.ma.ao .ma-t{top:-.62em;font-size:.62em}
.mo{display:inline-block;border-top:.07em solid currentColor;line-height:1.15}
.ml{display:inline-block;border-bottom:.07em solid currentColor;line-height:1.15}
.mus{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top}
.mus-b{font-size:.62em;line-height:1}
.mt{font-style:normal} .mu{font-style:normal} .mfx{font-style:normal;margin-right:.14em}
.mr{margin:0 .26em} .mb{margin:0 .2em}
.s1{display:inline-block;width:.17em} .s2{display:inline-block;width:.24em} .s4{display:inline-block;width:1em}
.mx{font-family:var(--pix);font-size:.7em;color:var(--bad)}

@keyframes flow{from{background-position:0 0}to{background-position:17px 0}}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.3}49%{opacity:1}51%{opacity:.5}52%{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fl-ok{0%{opacity:1;box-shadow:inset 0 0 0 6px var(--ok),inset 0 0 80px rgba(56,255,156,.5)}100%{opacity:0;box-shadow:inset 0 0 0 6px var(--ok)}}
@keyframes fl-bad{0%{opacity:1;box-shadow:inset 0 0 0 6px var(--bad),inset 0 0 80px rgba(255,69,112,.5)}100%{opacity:0;box-shadow:inset 0 0 0 6px var(--bad)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes whiteflash{from{opacity:.85}to{opacity:0}}
@keyframes zap{0%{transform:scale(.3) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#fx svg.zap path{stroke-dashoffset:0}#fx:before{opacity:0}}
@media (min-width:700px){#main{padding-left:20px;padding-right:20px}}

<noscript><p style="padding:40px 20px;color:#fff">STUDY.LOG braucht JavaScript.</p></noscript>
<script>
/* =====================================================================
   STUDY.LOG – Logik (ohne DOM). ES5, damit es auch auf älteren iPhones läuft.
   ===================================================================== */
var APP_VERSION = '1.0.0';
var STORE_KEY = 'studylog_v1_state';
var SCHEMA = 1;
var XP_CARD = 10, XP_DECK = 50, XP_ALL = 100;
var MASTER_STAGE = 5;

var NEWS = [
  { v: '1.0.0', date: '12.11.2026', items: [
    'Kartenstapel mit Stufen-System: Stufe n heißt alle n Tage. Falsch = zurück auf Stufe 1, die Karte kommt am Ende der Runde nochmal.',
    'Import von Kartenstapeln aus Chats – als Datei oder Text zum Einfügen.',
    'Formeln in LaTeX-Schreibweise, Skizzen und Fotos auf Karten.',
    'Prüfungstermin je Stapel mit Countdown.',
    'Level, Titel, Lernserie mit Wochen-Joker und Erfolge.',
    'Statistik, Freies Üben und Backup.'
  ] }
];

/* ---------- Grundlagen ---------- */
function now() { return Date.now(); }
function uid() { return now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clone(o) { return (o === undefined || o === null) ? o : JSON.parse(JSON.stringify(o)); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function escH(s) {
  return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtNum(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function cleanName(s) { return String(s || '').replace(/\s+/g, ' ').trim().slice(0, 80); }
function normKey(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

/* ---------- Datum (Tageswechsel um dayStartHour Uhr) ---------- */
function dayKeyOf(ts, startHour) {
  var d = new Date(ts - (startHour || 0) * 3600000);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function today() { return dayKeyOf(now(), S ? S.settings.dayStartHour : 3); }
function keyToUTC(k) { var p = k.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function utcToKey(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function addDays(k, n) { return utcToKey(keyToUTC(k) + n * 86400000); }
function daysBetween(a, b) { return Math.round((keyToUTC(b) - keyToUTC(a)) / 86400000); }
function isDayKey(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && utcToKey(keyToUTC(k)) === k; }
function fmtDay(k) { var p = k.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
var WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
function weekdayShort(k) { return WD[new Date(keyToUTC(k)).getUTCDay()]; }
function weekKey(k) {
  var t = new Date(keyToUTC(k));
  var dow = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - dow + 3);
  var y = t.getUTCFullYear();
  var f = new Date(Date.UTC(y, 0, 4));
  f.setUTCDate(f.getUTCDate() - ((f.getUTCDay() + 6) % 7) + 3);
  return y + '-W' + pad2(1 + Math.round((t - f) / 604800000));
}

/* ---------- Zustand ---------- */
var S = null;
function def() {
  return {
    schema: SCHEMA,
    createdAt: now(),
    profile: { form: null },
    settings: { newPerDay: 25, dayStartHour: 3 },
    decks: [],
    cards: [],
    xp: 0,
    totals: { answers: 0, correct: 0, wrong: 0, imports: 0, sketches: 0, undos: 0 },
    days: {},
    streak: { count: 0, best: 0, lastDay: null, lastSettled: null, jokers: [] },
    ach: {},
    lastBackup: 0,
    seenVersion: null
  };
}
function fillDefaults(base, saved) {
  if (!saved || typeof saved !== 'object') return base;
  for (var k in base) {
    if (!base.hasOwnProperty(k)) continue;
    if (!(k in saved) || saved[k] === undefined) saved[k] = base[k];
    else if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) &&
             saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k])) fillDefaults(base[k], saved[k]);
  }
  return saved;
}
function migrate(st) {
  /* künftige Schema-Migrationen hier einfügen (if (st.schema < 2) {...}) */
  st.schema = SCHEMA;
  for (var i = 0; i < st.cards.length; i++) ensureProg(st.cards[i]);
  return st;
}
function load() {
  var raw = null, st = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
  if (raw) { try { st = JSON.parse(raw); } catch (e2) { st = null; } }
  S = st ? migrate(fillDefaults(def(), st)) : def();
  return S;
}
var lastSaveOk = true;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); lastSaveOk = true; }
  catch (e) { lastSaveOk = false; }
  return lastSaveOk;
}

/* ---------- Stapel & Karten ---------- */
var TYPES = { frage: 'Frage', formel: 'Formel', zeichen: 'Formelzeichen', these: 'These' };
var TYPE_ORDER = ['frage', 'formel', 'zeichen', 'these'];
function normType(t) {
  t = normKey(t);
  if (TYPES[t]) return t;
  if (t === 'formelzeichen' || t === 'symbol' || t === 'zeichen' || t === 'größe' || t === 'groesse') return 'zeichen';
  if (t === 'formula' || t === 'gleichung') return 'formel';
  if (t === 'thesis' || t === 'aussage' || t === 'behauptung' || t === 'statement') return 'these';
  return 'frage';
}
function liveDecks() { var r = []; for (var i = 0; i < S.decks.length; i++) if (!S.decks[i].deleted) r.push(S.decks[i]); return r; }
function getDeck(id) { for (var i = 0; i < S.decks.length; i++) if (S.decks[i].id === id) return S.decks[i]; return null; }
function getCard(id) { for (var i = 0; i < S.cards.length; i++) if (S.cards[i].id === id) return S.cards[i]; return null; }
function deckCards(id) { var r = []; for (var i = 0; i < S.cards.length; i++) { var c = S.cards[i]; if (!c.deleted && c.deckId === id) r.push(c); } return r; }
function liveCards() {
  var ok = {}, r = [], ds = liveDecks(), i;
  for (i = 0; i < ds.length; i++) ok[ds[i].id] = 1;
  for (i = 0; i < S.cards.length; i++) if (!S.cards[i].deleted && ok[S.cards[i].deckId]) r.push(S.cards[i]);
  return r;
}
function addDeck(name, opt) {
  opt = opt || {};
  var t = now();
  var d = { id: uid(), name: cleanName(name) || 'Neuer Stapel', desc: String(opt.desc || ''),
            examDate: isDayKey(opt.examDate) ? opt.examDate : null, examRepeat: true,
            createdAt: t, updatedAt: t, deleted: false, deletedAt: null };
  S.decks.push(d);
  return d;
}
function updateDeck(d, data) {
  if ('name' in data) d.name = cleanName(data.name) || d.name;
  if ('desc' in data) d.desc = String(data.desc || '');
  if ('examDate' in data) d.examDate = isDayKey(data.examDate) ? data.examDate : null;
  if ('examRepeat' in data) d.examRepeat = !!data.examRepeat;
  d.updatedAt = now();
}
function deleteDeck(d) {
  var t = now(), cs = deckCards(d.id);
  d.deleted = true; d.deletedAt = t; d.updatedAt = t;
  for (var i = 0; i < cs.length; i++) { cs[i].deleted = true; cs[i].deletedAt = t; cs[i].updatedAt = t; }
}
function newProg() { return { stage: 0, due: null, last: null, first: null, relearn: false, reps: 0, lapses: 0, best: 0, seen: false }; }
function ensureProg(c) {
  if (!c.prog) c.prog = {};
  if (!c.prog.f) c.prog.f = newProg();
  if (c.both && !c.prog.r) c.prog.r = newProg();
}
function addCard(deckId, data) {
  var t = now();
  var c = { id: uid(), deckId: deckId, type: normType(data.type), front: String(data.front || ''), back: String(data.back || ''),
            both: !!data.both, mFront: data.mFront || null, mBack: data.mBack || null, prog: null,
            createdAt: t, updatedAt: t, deleted: false, deletedAt: null };
  ensureProg(c);
  S.cards.push(c);
  return c;
}
function updateCard(c, data) {
  var keys = ['type', 'front', 'back', 'both', 'mFront', 'mBack'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (!(k in data)) continue;
    if (k === 'type') c.type = normType(data.type);
    else if (k === 'both') c.both = !!data.both;
    else if (k === 'front' || k === 'back') c[k] = String(data[k] || '');
    else c[k] = data[k] || null;

  var f = $('flash'); f.className = ''; void f.offsetWidth; f.className = kind;
}
function doAnswer(good) {
  var s = UI.session; if (!s || !s.flipped || s.finished) return;
  var it = s.queue[s.pos];
  if (!s.practice && today() !== s.t) { toast('Neuer Lerntag – die Runde wird neu zusammengestellt.'); hideLayer(); UI.session = null; render(); return; }
  if (s.practice) {
    s.hist.push({ practice: true, pos: s.pos, len: s.queue.length, ok: s.ok, bad: s.bad });
    if (good) s.ok++; else { s.bad++; s.queue.push(it); }
  } else {

    s.hist.push(sn);
    var res = answerItem(it, good, s.t);

    if (res.first) { if (good) s.ok++; else s.bad++; }
    s.xp += res.xp;
    for (var i = 0; i < res.events.length; i++) s.events.push(res.events[i]);

    if (i < ti) s += '<div class="got">' + icon('check') + '<span class="lv">LV ' + T[0] + '</span>' + h(nm) + '</div>';
    else if (i === ti) s += '<div class="cur">' + icon('bolt') + '<span class="lv">LV ' + T[0] + '</span>' + h(nm) + '</div>';
    else if (i === ti + 1) s += '<div class="lock">' + icon('lock') + '<span class="lv">LV ' + T[0] + '</span>' + h(nm) + '</div>';
    else s += '<div class="lock">' + icon('lock') + '<span class="lv">LV ' + T[0] + '</span>???</div>';
  }
  s += '</div>';
  var got = 0, grid = '';
  for (var j = 0; j < ACH.length; j++) {
    var a = ACH[j], on = !!S.ach[a.id];
    if (on) got++;
    if (!on && a.h) grid += '<div class="ach off"><div class="badge">' + icon('lock') + '</div><b>???</b><small>Geheimer Erfolg</small></div>';
    else grid += '<div class="ach ' + (on ? 'on' : 'off') + '"><div class="badge">' + icon(a.i) + '</div><b>' + h(a.n) + '</b><small>' + h(a.d) + '</small></div>';
  }
  s += '<div class="sec-h"><h2>Erfolge</h2><span class="pix dim" style="font-size:12px">' + got + ' / ' + ACH.length + '</span></div><div class="agrid">' + grid + '</div>';
  s += '<section class="panel" style="margin-top:16px"><h3>So gibt es XP</h3><ul class="xp-rules"><li>' + XP_CARD + ' XP pro fälliger Karte – egal ob gewusst oder nicht. Ehrlich antworten lohnt sich.</li>' +
    '<li>+' + XP_DECK + ' XP, wenn ein Stapel für heute geschafft ist.</li><li>+' + XP_ALL + ' XP, wenn alle Stapel geschafft sind – das zählt auch für die Serie.</li>' +
    '<li>1 Joker pro Woche rettet automatisch die Serie, wenn du mal einen Tag nicht lernen kannst.</li><li>Freies Üben gibt keine XP.</li></ul></section>';
  return s;
}

/* ---------- Statistik ---------- */
function viewStats() {
  var t = today(), tot = S.totals, cs = liveCards(), items = 0, hi = 0, i, j;
  for (i = 0; i < cs.length; i++) { var dirs = cardDirs(cs[i]); for (j = 0; j < dirs.length; j++) { items++; if (cs[i].prog[dirs[j]].stage >= MASTER_STAGE) hi++; } }
  var quote = tot.answers ? Math.round(100 * tot.correct / tot.answers) : 0;
  var s = '<section class="panel"><h2>Überblick</h2><div class="kgrid">' +
    '<div><b>' + fmtNum(tot.answers) + '</b><span>Antworten</span></div><div><b>' + quote + ' %</b><span>gewusst</span></div><div><b>' + fmtNum(cs.length) + '</b><span>Karten</span></div>' +
    '<div><b>' + (items ? Math.round(100 * hi / items) : 0) + ' %</b><span>sitzen</span></div><div><b>' + S.streak.best + '</b><span>Rekordserie</span></div><div><b>' + fmtNum(S.xp) + '</b><span>XP gesamt</span></div></div></section>';
  var days = [], mx = 1;
  for (i = 13; i >= 0; i--) { var k = addDays(t, -i), r = S.days[k]; days.push({ k: k, ok: r ? r.correct : 0, bad: r ? r.wrong : 0 }); }
  for (i = 0; i < days.length; i++) mx = Math.max(mx, days[i].ok + days[i].bad);
  var bars = '';
  for (i = 0; i < days.length; i++) {
    var dd = days[i], tt = dd.ok + dd.bad;
    bars += '<div>' + (tt ? '<span class="bn">' + tt + '</span>' : '') + '<div class="bv" style="height:' + Math.round(100 * tt / mx) + '%"><i class="b-ok" style="height:' + (tt ? 100 * dd.ok / tt : 0) + '%"></i><i class="b-bad" style="height:' + (tt ? 100 * dd.bad / tt : 0) + '%"></i></div><span class="bl">' + weekdayShort(dd.k) + '</span></div>';
  }
  s += '<section class="panel"><h3>Letzte 14 Tage</h3><div class="bars">' + bars + '</div><div class="legend"><span><i style="background:var(--ok)"></i>gewusst</span><span><i style="background:var(--bad)"></i>nicht gewusst</span></div></section>';
  var fc = forecast(t, 7), fm = 1, fb = '';
  for (i = 0; i < fc.length; i++) fm = Math.max(fm, fc[i]);
  for (i = 0; i < fc.length; i++) fb += '<div><span class="bn">' + fc[i] + '</span><div class="bv" style="height:' + Math.round(100 * fc[i] / fm) + '%"><i class="b-fc" style="height:100%"></i></div><span class="bl">' + (i === 0 ? 'heute' : weekdayShort(addDays(t, i))) + '</span></div>';
  s += '<section class="panel"><h3>Fällig in den nächsten 7 Tagen</h3><div class="bars">' + fb + '</div><p style="font-size:12px;margin:8px 0 0">Ohne neue Karten der nächsten Tage.</p></section>';
  var ds = liveDecks();
  if (ds.length) {
    var rows = '';
    for (i = 0; i < ds.length; i++) { var st = deckStats(ds[i], t); rows += '<tr><td>' + h(ds[i].name) + '</td><td>' + st.cards + '</td><td>' + st.pct + ' %</td><td>' + (ds[i].examDate ? fmtDay(ds[i].examDate).slice(0, 6) : '–') + '</td></tr>'; }
    s += '<section class="panel"><h3>Stapel</h3><table class="dtab"><tr><th>Stapel</th><th>Karten</th><th>sitzen</th><th>Prüfung</th></tr>' + rows + '</table></section>';
  }
  return s;
}

/* ---------- Mehr / Einstellungen ---------- */
function viewMore() {
  var st = S.settings;
  var s = '<section class="panel"><h3>Profil</h3><div class="set-row"><div class="lbl">Titelform<small>z. B. ' + h(titleFor(28, 'm')) + ' / ' + h(titleFor(28, 'w')) + '</small></div>' +
    '<div class="seg" style="margin:0;flex:none"><button data-a="setForm" data-v="m" class="' + (S.profile.form !== 'w' ? 'on' : '') + '">Männl.</button><button data-a="setForm" data-v="w" class="' + (S.profile.form === 'w' ? 'on' : '') + '">Weibl.</button></div></div></section>';
  s += '<section class="panel"><h3>Lernen</h3>' +
    '<div class="set-row"><div class="lbl">Neue Karten pro Stapel und Tag</div><div class="stepper"><button data-a="setNew" data-v="-5">−</button><b>' + st.newPerDay + '</b><button data-a="setNew" data-v="5">+</button></div></div>' +
    '<div class="set-row"><div class="lbl">Neuer Lerntag beginnt um<small>Lernen nach Mitternacht zählt noch zum Vortag</small></div><div class="stepper"><button data-a="setHour" data-v="-1">−</button><b>' + st.dayStartHour + ':00</b><button data-a="setHour" data-v="1">+</button></div></div></section>';
  s += '<section class="panel"><h3>Karten</h3><button class="btn full" data-a="openImport">' + icon('imp') + 'Karten importieren</button>' +
    '<button class="btn ghost full" style="margin-top:12px" data-a="copyGuide">' + icon('copy') + 'Anleitung für Chats kopieren</button></section>';
  s += '<section class="panel"><h3>Daten</h3><p>Alles bleibt auf diesem iPhone. Mach regelmäßig ein Backup (z. B. in die Dateien-App oder iCloud Drive).<br>Letztes Backup: <b>' + (S.lastBackup ? new Date(S.lastBackup).toLocaleDateString('de-DE') : 'noch nie') + '</b></p>' +
    '<button class="btn full" data-a="backup">' + icon('save') + 'Backup erstellen</button>' +
    '<button class="btn ghost full" style="margin-top:12px" data-a="restore">' + icon('up') + 'Backup wiederherstellen</button></section>';
  s += '<section class="panel"><h3>Info</h3><button class="btn ghost full" data-a="news">' + icon('news') + 'Neuigkeiten</button>' +
    '<p style="margin:12px 0 0;font-size:12px">STUDY.LOG ' + APP_VERSION + ' · offline nutzbar · keine Werbung, kein Tracking.</p></section>';
  return s;
}
function prepareBackup() {
  toast('Backup wird vorbereitet …');
  buildBackup(function (obj) {
    var txt = JSON.stringify(obj), name = 'studylog-backup-' + today() + '.json';
    UI.backupBlob = { blob: new Blob([txt], { type: 'application/json' }), name: name };
    sheet('<h2>Backup bereit</h2><p>' + name + '<br>' + (txt.length / 1048576).toFixed(2) + ' MB · ' + liveCards().length + ' Karten</p>' +
      '<p>Tippe auf „Sichern“ und wähle z. B. „In Dateien sichern“.</p><button class="btn full" data-a="backupGo">' + icon('save') + 'Sichern</button>' +
      '<button class="btn ghost full" style="margin-top:12px" data-a="closeSheet">Abbrechen</button>');
  });
}
function backupGo() {
  var b = UI.backupBlob; if (!b) return;
  var file = null;
  try { file = new File([b.blob], b.name, { type: 'application/json' }); } catch (e) { file = null; }
  var mark = function () { S.lastBackup = now(); persist(); closeSheet(); render(); toast('Backup gesichert.'); };
  if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'STUDY.LOG Backup' }).then(mark, function (err) { if (err && err.name !== 'AbortError') { download(b.blob, b.name); mark(); } });
  } else { download(b.blob, b.name); mark(); }
}
function download(blob, name) {
  var a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.parentNode.removeChild(a); }, 3000);
}
function onRestoreFile(file) {
  readFile(file, function (txt) {
    var obj = null;
    try { obj = JSON.parse(txt); } catch (e) { obj = null; }
    if (!obj || obj.format !== 'studylog-backup-1') { toast('Das ist keine STUDY.LOG-Sicherung.'); return; }
    var n = 0; try { n = obj.state.cards.filter(function (c) { return !c.deleted; }).length; } catch (e2) { n = 0; }
    if (!window.confirm('Sicherung vom ' + new Date(obj.exportedAt).toLocaleDateString('de-DE') + ' mit ' + n + ' Karten laden?\nDie aktuellen Daten werden dabei ersetzt.')) return;
    restoreBackup(obj, function (err) {
      if (err) { toast(err); return; }
      settleStreak(today());
      persist();
      UI.view = null; UI.tab = 'home'; render();
      toast('Sicherung geladen.');
    });
  });
}
function showWelcome() {
  sheet('<h2 class="glow">Willkommen bei STUDY.LOG</h2><p>Deine Lernkarten für die Technikerschule.</p><ul>' +
    '<li>Jeder Stapel hat jeden Tag seine Runde.</li><li>Gewusst: Die Karte kommt seltener – alle 2, 3, 4 … Tage.</li>' +
    '<li>Nicht gewusst: Sie kommt am Ende der Runde nochmal und morgen wieder.</li><li>Karten lässt du dir von Chats erstellen und importierst sie.</li></ul>' +
    '<p>Wie sollen deine Titel lauten?</p><div class="form-pick"><button class="btn" data-a="pickForm" data-v="m">Techniker</button><button class="btn" data-a="pickForm" data-v="w">Technikerin</button></div>');
}
function showNews(all) {
  var s = '<h2>Neuigkeiten</h2>';
  for (var i = 0; i < NEWS.length; i++) {
    if (!all && S.seenVersion && !newer(NEWS[i].v, S.seenVersion)) continue;
    s += '<div class="news-v">VERSION ' + NEWS[i].v + ' · ' + NEWS[i].date + '</div><ul>';
    for (var j = 0; j < NEWS[i].items.length; j++) s += '<li>' + h(NEWS[i].items[j]) + '</li>';
    s += '</ul>';
  }
  sheet(s + '<button class="btn full" data-a="newsOk">Alles klar</button>');
}
function newer(a, b) {
  var x = a.split('.'), y = b.split('.');
  for (var i = 0; i < 3; i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d) return d > 0; }
  return false;
}

/* ---------- Toasts ---------- */
function toast(msg, ach) {
  var box = $('toasts'); if (!box) return;
  var el = document.createElement('div');
  el.className = 'toast' + (ach ? ' tach' : '');
  el.innerHTML = ach ? icon(ach.i) + '<div><b>Erfolg freigeschaltet</b>' + h(ach.n) + '</div>' : h(msg);
  box.appendChild(el);
  setTimeout(function () { el.className += ' out'; setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350); }, ach ? 3600 : 2600);
}
function toastAch(a) { toast('', a); }

/* ---------- Aktionen ---------- */
var ACTIONS = {
  tab: function (v) { go(v); },
  home: function () { UI.view = null; UI.tab = 'home'; UI.search = ''; render(); window.scrollTo(0, 0); },
  openDeck: function (v) { UI.view = 'deck'; UI.deckId = v; UI.search = ''; render(); window.scrollTo(0, 0); },
  learn: function (v) { startSession(v, false); },
  practice: function (v) { startSession(v, true); },
  newDeck: function () { newDeckSheet(); },
  editDeck: function (v) { editDeckSheet(v); },
  saveDeck: function (v) { saveDeckForm(v); },
  delDeck: function (v) {
    var d = getDeck(v);
    if (!window.confirm('Stapel „' + d.name + '“ mit ' + deckCards(d.id).length + ' Karten löschen?')) return;
    deleteDeck(d); persist(); closeSheet(); UI.view = null; UI.tab = 'home'; render(); toast('Stapel gelöscht.');
  },
  closeSheet: function () { closeSheet(); },
  flip: function () { flipCard(); },
  ans: function (v) { doAnswer(v === '1'); },
  undo: function () { doUndo(); },
  endSession: function () { var s = UI.session; if (s && s.hist.length) finishSession(); else closeSession(); },
  closeSession: function () { closeSession(); },
  newCard: function (v) { openEditor(null, v); },
  editCard: function (v) { openEditor(v, null); },
  edType: function (v) {
    var e = UI.editor; edSync(); e.type = v;
    if (v === 'zeichen' && !e.id && !e.both) e.both = true;
    renderEditor();
  },
  edSave: function () { edSave(); },
  edCancel: function () { edCancel(); },
  edDel: function () { edDelete(); },
  skNew: function (v) { openSketch(v, null); },
  skEdit: function (v) { openSketch(v, UI.editor[v === 'front' ? 'mFront' : 'mBack']); },
  mDel: function (v) { edSync(); setMedia(v, null); renderEditor(); },
  mPhoto: function (v) { pickPhoto(v); },
  skColor: function (v) { UI.sketch.color = SK_COLORS[+v]; UI.sketch.eraser = false; renderSketchTools(); },
  skWidth: function (v) { UI.sketch.width = SK_WIDTHS[+v]; renderSketchTools(); },
  skEraser: function () { UI.sketch.eraser = !UI.sketch.eraser; renderSketchTools(); },
  skUndo: function () { UI.sketch.strokes.pop(); skRedraw(); },
  skClear: function () { if (!window.confirm('Skizze komplett leeren?')) return; UI.sketch.strokes = []; UI.sketch.base = null; UI.sketch.kind = 'png'; skRedraw(); },
  skSave: function () { skSave(); },
  skCancel: function () { UI.sketch = null; renderEditor(); },
  openImport: function () { UI.view = 'import'; UI.imp = null; render(); window.scrollTo(0, 0); },
  pickFile: function () { var i = $('fileIn'); i.value = ''; i.click(); },
  impCheck: function () { var v = $('impText').value; if (!v.trim()) { toast('Erst Text einfügen.'); return; } impSetText(v); },
  impMode: function (v) { var p = v.split(':'); UI.imp.modes[+p[0]] = p[1]; $('impOut').innerHTML = impPlanHtml(); },
  impGo: function () { impGo(); },
  copyGuide: function () { copyGuide(); },
  setForm: function (v) { S.profile.form = v; persist(); render(); },
  pickForm: function (v) { S.profile.form = v; S.seenVersion = APP_VERSION; persist(); closeSheet(); render(); },
  setNew: function (v) { S.settings.newPerDay = Math.max(5, Math.min(100, S.settings.newPerDay + (+v))); persist(); render(); },
  setHour: function (v) { S.settings.dayStartHour = Math.max(0, Math.min(6, S.settings.dayStartHour + (+v))); persist(); UI.lastDay = today(); render(); },
  backup: function () { prepareBackup(); },
  backupGo: function () { backupGo(); },
  restore: function () { var i = $('bakIn'); i.value = ''; i.click(); },
  news: function () { showNews(true); },
  newsOk: function () { S.seenVersion = APP_VERSION; persist(); closeSheet(); }
};
function renderSketchTools() {
  var strokes = UI.sketch.strokes, base = UI.sketch.base;
  renderSketch();
  UI.sketch.strokes = strokes; UI.sketch.base = base; skRedraw();
}

/* ---------- Start ---------- */
function onDayCheck() {
  var t = today();
  if (t === UI.lastDay) return;
  UI.lastDay = t;
  var r = settleStreak(t);
  if (r.joker) { toast('Joker eingesetzt – deine Serie lebt!'); persist(checkAch({ joker: true })); } else persist();
  if (r.broken) toast('Serie unterbrochen – neuer Anlauf!');
  if (!UI.session && !UI.editor) render();
}
function boot() {
  load();
  UI.lastDay = today();
  var r = settleStreak(UI.lastDay);
  var ach = r.joker ? checkAch({ joker: true }) : [];
  persist(ach);
  render();
  mediaInit(function () { hydrateMedia($('main')); });

  document.addEventListener('click', function (ev) {
    var fx = $('fx');
    if (fx.className !== 'hidden' && fx.contains(ev.target)) { fx.className = 'hidden'; return; }
    if (ev.target.id === 'sheet') { if (!(S.profile.form === null)) closeSheet(); return; }
    var el = closest(ev.target, 'data-a');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-a')];
    if (fn) { ev.preventDefault(); fn(el.getAttribute('data-v'), el, ev); }
  });
  var snipDown = function (ev) {
    var b = closest(ev.target, 'data-snip'); if (!b) return;
    ev.preventDefault(); insertSnip(+b.getAttribute('data-snip'));
  };
  document.addEventListener('touchstart', snipDown, { passive: false });
  document.addEventListener('mousedown', function (ev) { if (!('ontouchstart' in window)) snipDown(ev); });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'cardSearch') { UI.search = t.value; var d = getDeck(UI.deckId); if (d) $('clist').innerHTML = cardList(deckCards(d.id)); }
    else if (t.getAttribute && t.getAttribute('data-side')) edInput(t.getAttribute('data-side'), t.value);
  });
  document.addEventListener('focusin', function (ev) { var t = ev.target; if (t.getAttribute && t.getAttribute('data-side')) edFocus(t.getAttribute('data-side')); });
  document.addEventListener('keydown', function (ev) {
    var s = UI.session; if (!s || s.finished || /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flipCard(); }
    else if (s.flipped && (ev.key === 'ArrowRight' || ev.key === 'j')) doAnswer(true);
    else if (s.flipped && (ev.key === 'ArrowLeft' || ev.key === 'f')) doAnswer(false);
  });
  $('fileIn').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    readFile(f, function (txt) { var ta = $('impText'); if (ta) ta.value = txt.length > 200000 ? '' : txt; impSetText(txt); });
  });
  $('bakIn').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) onRestoreFile(f); });
  $('imgIn').addEventListener('change', function () { var f = this.files && this.files[0]; if (f) onPhoto(f); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) onDayCheck(); });
  setInterval(onDayCheck, 60000);

  if (S.profile.form === null) showWelcome();
  else if (S.seenVersion !== APP_VERSION) showNews(false);
  if (r.joker) toast('Joker eingesetzt – deine Serie lebt!');
  if (r.broken) toast('Serie unterbrochen – neuer Anlauf!');

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    try { navigator.serviceWorker.register('./sw.js'); } catch (e) { /* offline egal */ }
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
